[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pima"
version = "0.1.0"
description = "Classification and clustering analysis of the Pima Indians Diabetes dataset"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
markers = ["slow: takes seconds rather than milliseconds (t-SNE, large sweeps)"]
